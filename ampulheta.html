<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampulheta</title>
  <style>
    :root {
      --bg: #10131c;
      --panel: rgba(27, 32, 47, 0.78);
      --panel-border: rgba(255, 255, 255, 0.1);
      --text: #f6f7fb;
      --muted: #a7afc2;
      --accent: #f5b544;
      --accent-light: #ffe8a8;
      --accent-dark: #b96b17;
      --danger: #ff7d73;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(90, 76, 147, 0.3), transparent 32%),
        radial-gradient(circle at 85% 85%, rgba(191, 112, 37, 0.18), transparent 32%),
        var(--bg);
    }

    .app {
      width: min(100%, 920px);
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 27px 34px;
      border-bottom: 1px solid var(--panel-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .brand-mark {
      display: grid;
      width: 37px;
      height: 37px;
      place-items: center;
      border-radius: 12px;
      color: #19130a;
      background: linear-gradient(145deg, var(--accent-light), var(--accent));
      box-shadow: 0 7px 22px rgba(245, 181, 68, 0.24);
    }

    .status {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 0.88fr;
      gap: 48px;
      align-items: center;
      padding: 50px 58px 58px;
    }

    .eyebrow {
      margin: 0 0 11px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 380px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 0.98;
      letter-spacing: -0.06em;
    }

    .description {
      max-width: 390px;
      margin: 20px 0 30px;
      color: var(--muted);
      line-height: 1.6;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      color: var(--muted);
      font-size: 0.77rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      border: 1px solid var(--panel-border);
      border-radius: 13px;
      outline: none;
      padding: 13px 14px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.065);
      font: inherit;
      font-size: 1.05rem;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 181, 68, 0.14);
    }

    .quick-times {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .quick-times button,
    .secondary {
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.045);
      font: inherit;
      font-size: 0.78rem;
      cursor: pointer;
      transition: 160ms ease;
    }

    .quick-times button:hover,
    .secondary:hover {
      border-color: rgba(245, 181, 68, 0.55);
      color: var(--accent-light);
      transform: translateY(-1px);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .primary {
      flex: 1;
      min-width: 150px;
      border: 0;
      border-radius: 14px;
      padding: 14px 22px;
      color: #1d1508;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      box-shadow: 0 12px 25px rgba(245, 181, 68, 0.18);
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      transition: 160ms ease;
    }

    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(245, 181, 68, 0.28);
    }

    .secondary {
      min-width: 112px;
      padding: 14px 18px;
      border-radius: 14px;
      color: var(--text);
      font-weight: 700;
    }

    .timer-area {
      display: grid;
      justify-items: center;
      gap: 20px;
    }

    .hourglass-wrap {
      position: relative;
      display: grid;
      width: min(100%, 310px);
      aspect-ratio: 0.76;
      place-items: center;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      background: radial-gradient(circle, rgba(255, 210, 112, 0.11), transparent 63%), rgba(0, 0, 0, 0.13);
    }

    .hourglass {
      position: relative;
      width: 172px;
      height: 235px;
      filter: drop-shadow(0 18px 16px rgba(0, 0, 0, 0.36));
    }

    .glass {
      position: absolute;
      left: 50%;
      width: 114px;
      height: 105px;
      transform: translateX(-50%);
      overflow: hidden;
      background: rgba(177, 221, 255, 0.06);
      border: 2px solid rgba(198, 227, 255, 0.66);
      box-shadow: inset 0 0 18px rgba(169, 214, 255, 0.1);
    }

    .glass.top {
      top: 21px;
      clip-path: polygon(0 0, 100% 0, 57% 100%, 43% 100%);
      border-bottom: 0;
      border-radius: 13px 13px 0 0;
    }

    .glass.bottom {
      bottom: 21px;
      clip-path: polygon(43% 0, 57% 0, 100% 100%, 0 100%);
      border-top: 0;
      border-radius: 0 0 13px 13px;
    }

    .sand {
      position: absolute;
      z-index: 1;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(160deg, var(--accent-light), var(--accent) 60%, var(--accent-dark));
      transition: height 600ms linear;
    }

    .sand.top-sand {
      top: 0;
      bottom: auto;
      height: 100%;
      clip-path: polygon(0 0, 100% 0, 57% 100%, 43% 100%);
    }

    .sand.bottom-sand {
      clip-path: polygon(43% 0, 57% 0, 100% 100%, 0 100%);
    }

    .stream {
      position: absolute;
      z-index: 3;
      top: 105px;
      left: calc(50% - 2px);
      width: 4px;
      height: 0;
      border-radius: 99px;
      background: var(--accent-light);
      box-shadow: 0 0 10px var(--accent);
    }

    .hourglass.running .stream {
      height: 50px;
      animation: stream 0.55s linear infinite;
    }

    .grain {
      position: absolute;
      z-index: 4;
      top: 105px;
      left: calc(50% - 3px);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-light);
      box-shadow: 0 0 7px var(--accent);
      opacity: 0;
    }

    .hourglass.running .grain {
      animation: grain 0.8s linear infinite;
    }

    .bar {
      position: absolute;
      z-index: 5;
      left: 50%;
      width: 172px;
      height: 13px;
      transform: translateX(-50%);
      border: 2px solid rgba(249, 211, 139, 0.72);
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent-dark), var(--accent-light), var(--accent-dark));
      box-shadow: 0 4px 7px rgba(0, 0, 0, 0.22);
    }

    .bar.top {
      top: 14px;
    }

    .bar.bottom {
      bottom: 14px;
    }

    .time {
      position: absolute;
      right: 17px;
      bottom: 15px;
      z-index: 7;
      color: rgba(255, 255, 255, 0.68);
      font-size: 0.74rem;
      font-weight: 750;
      letter-spacing: 0.06em;
    }

    .countdown {
      margin: 0;
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.8rem, 8vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.07em;
    }

    .timer-message {
      min-height: 21px;
      margin: -12px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    @keyframes stream {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }

    @keyframes grain {
      0% { transform: translateY(0); opacity: 0; }
      12% { opacity: 1; }
      100% { transform: translateY(53px); opacity: 0.9; }
    }

    @media (max-width: 740px) {
      body {
        padding: 12px;
      }

      .topbar {
        padding: 22px;
      }

      .content {
        grid-template-columns: 1fr;
        gap: 34px;
        padding: 35px 24px 40px;
      }

      .intro {
        order: 2;
      }

      .timer-area {
        order: 1;
      }

      .hourglass-wrap {
        width: min(100%, 275px);
      }
    }

    @media (max-width: 390px) {
      .status {
        display: none;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .primary {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">⌛</span>
        <span>Ampulheta</span>
      </div>
      <span class="status" id="status">Pronta para começar</span>
    </header>

    <section class="content">
      <div class="intro">
        <p class="eyebrow">Foco no agora</p>
        <h1>Seu tempo, no ritmo certo.</h1>
        <p class="description">
          Configure a duração, vire a ampulheta e deixe o tempo trabalhar por você.
        </p>

        <div class="settings">
          <div class="field">
            <label for="minutes">Minutos</label>
            <input id="minutes" type="number" min="0" max="999" value="5" inputmode="numeric">
          </div>
          <div class="field">
            <label for="seconds">Segundos</label>
            <input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric">
          </div>
        </div>

        <div class="quick-times" aria-label="Durações rápidas">
          <button type="button" data-time="60">1 min</button>
          <button type="button" data-time="300">5 min</button>
          <button type="button" data-time="900">15 min</button>
          <button type="button" data-time="1500">25 min</button>
        </div>

        <div class="actions">
          <button class="primary" id="startButton" type="button">▶ Iniciar</button>
          <button class="secondary" id="resetButton" type="button">↺ Reiniciar</button>
        </div>
      </div>

      <div class="timer-area">
        <div class="hourglass-wrap">
          <div class="hourglass" id="hourglass" aria-label="Ampulheta animada">
            <div class="bar top"></div>
            <div class="glass top">
              <div class="sand top-sand" id="topSand"></div>
            </div>
            <!--div class="stream"></div-->
          <!--div class="grain"></div-->
            <div class="glass bottom">
              <div class="sand bottom-sand" id="bottomSand"></div>
            </div>
            <div class="bar bottom"></div>
          </div>
          <span class="time">TEMPO</span>
        </div>
        <p class="countdown" id="countdown">05:00</p>
        <p class="timer-message" id="timerMessage">Defina o tempo e clique em iniciar.</p>
      </div>
    </section>
  </main>

  <script>
    const minutesInput = document.getElementById("minutes");
    const secondsInput = document.getElementById("seconds");
    const startButton = document.getElementById("startButton");
    const resetButton = document.getElementById("resetButton");
    const countdown = document.getElementById("countdown");
    const status = document.getElementById("status");
    const timerMessage = document.getElementById("timerMessage");
    const hourglass = document.getElementById("hourglass");
    const topSand = document.getElementById("topSand");
    const bottomSand = document.getElementById("bottomSand");
    const quickButtons = document.querySelectorAll("[data-time]");

    let totalSeconds = 300;
    let remainingSeconds = totalSeconds;
    let timerId = null;
    let isRunning = false;

    function getInputSeconds() {
      const minutes = Math.max(0, parseInt(minutesInput.value, 10) || 0);
      const seconds = Math.min(59, Math.max(0, parseInt(secondsInput.value, 10) || 0));
      minutesInput.value = minutes;
      secondsInput.value = seconds;
      return minutes * 60 + seconds;
    }

    function formatTime(value) {
      const minutes = Math.floor(value / 60);
      const seconds = value % 60;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function updateSand() {
      const progress = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
      topSand.style.height = `${progress * 100}%`;
      bottomSand.style.height = `${(1 - progress) * 100}%`;
    }

    function updateDisplay() {
      countdown.textContent = formatTime(remainingSeconds);
      updateSand();
      document.title = `${formatTime(remainingSeconds)} · Ampulheta`;
    }

    function setDuration(value) {
      stopTimer();
      totalSeconds = Math.max(1, value);
      remainingSeconds = totalSeconds;
      minutesInput.value = Math.floor(totalSeconds / 60);
      secondsInput.value = totalSeconds % 60;
      status.textContent = "Pronta para começar";
      timerMessage.textContent = "Defina o tempo e clique em iniciar.";
      updateDisplay();
    }

    function startTimer() {
      if (isRunning) {
        stopTimer();
        return;
      }

      if (remainingSeconds <= 0) {
        totalSeconds = getInputSeconds() || 1;
        remainingSeconds = totalSeconds;
      }

      isRunning = true;
      hourglass.classList.add("running");
      startButton.textContent = "Ⅱ Pausar";
      status.textContent = "Contando o tempo";
      timerMessage.textContent = "Mantenha o foco. A ampulheta está virada.";

      timerId = setInterval(() => {
        remainingSeconds -= 1;
        updateDisplay();

        if (remainingSeconds <= 0) {
          finishTimer();
        }
      }, 1000);
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      isRunning = false;
      hourglass.classList.remove("running");
      startButton.textContent = "▶ Continuar";
    }

    function finishTimer() {
      stopTimer();
      remainingSeconds = 0;
      updateDisplay();
      status.textContent = "Tempo concluído";
      timerMessage.textContent = "Pronto. Você concluiu este ciclo.";
      startButton.textContent = "▶ Iniciar novamente";
    }

    function resetTimer() {
      stopTimer();
      totalSeconds = Math.max(1, getInputSeconds());
      remainingSeconds = totalSeconds;
      status.textContent = "Pronta para começar";
      timerMessage.textContent = "Defina o tempo e clique em iniciar.";
      startButton.textContent = "▶ Iniciar";
      updateDisplay();
    }

    startButton.addEventListener("click", startTimer);
    resetButton.addEventListener("click", resetTimer);

    [minutesInput, secondsInput].forEach((input) => {
      input.addEventListener("change", () => {
        if (!isRunning) resetTimer();
      });
    });

    quickButtons.forEach((button) => {
      button.addEventListener("click", () => setDuration(Number(button.dataset.time)));
    });

    updateDisplay();
  </script>
</body>
</html>
